<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration</title>
    <link rel="stylesheet" href="../Design/customer.css">
</head> 

<body>
     <img src="../Image/logo.png" id="logo" alt="ParcelPaiso logo">

    <div class = "header">
        <h1>Customer Registration</h1>
        <p>Create an account to book and track your parcels</p>
    </div>
    <div class ="topnav">
        <a href="customerLogin.html">Login</a>
        <a href="customerRegistration.html" class="active">Registration</a>

    </div>
    <form id="registerForm" novalidate>
        <fieldset>
            <legend>Personal Information</legend>
            <table>
                <tr>
                    <td><label for = "fullName">Full Name:</label></td>
                    <td><input type = "text" id="fullName" name="fullName" placeholder="Please enter your full name" required>
                    <span class="error" id="FullNameError"></span></td>
                </tr>
                <tr>
                    <td><label for = "email">Email:</label></td>
                    <td><input type = "email" id="email" name="email" placeholder="you@example.com" required>
                     <span class="error" id="EmailError"></span></td>
                </tr>
                <tr>
                    <td><label for = "phone">Phone Number:</label></td>
                    <td><input type = "tel" id="phone" name="phone" placeholder="01XXXXXXXXX"pattern="01[0-9]{9}" required>
                     <span class="error" id="PhoneError"></span></td>
                </tr>
                <tr>
                    <td><label for = "dob">Date of Birth:</label></td>
                    <td><input type = "date" id="dob" name="dob">
                     <span class="error" id="DobError"></span></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" id = "male" name = "gender" value="male"><label for="male">Male</label>
                        <input type="radio" id = "female" name = "gender" value="female"><label for="female">Female</label>
                         <span class="error" id="GenderError"></span>

                    </td>
                    </tr>
                <tr>
                    <td><label for = "city">City:</label></td>
                    <td>
                        <select id="city"name="city" required>
                            <option value="">Select city</option>
                            <option value="dhaka">Dhaka</option>
                            <option value="chittagong">Chittagong</option>
                            <option value="rajshahi">Rajshahi</option>
                            <option value="rangpur">Rangpur</option>
                            <option value="mymensingh">Mymensingh</option>
                            <option value="sylhet">Sylhet</option>
                            <option value="khulna">Khulna</option>
                            <option value="barisal">Barisal</option>
                           
                        </select>
                          <span class="error" id="CityError"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for = "address">Address:</label></td>
                    <td><textarea id = "address" name="address" rows="4" cols="30" placeholder="House, Road, Area"></textarea>
                     <span class="error" id="AddressError"></span></td>
                </tr>
                </table>
                </fieldset>

                <fieldset>
                    <legend>Account Information</legend>
                    <table>
                        <tr>
                            <td><label for="username">Username:</label></td>
                            <td><input type= "text" id="username" name="username"required>
                             <span class="error" id="UsernameError"></span></td>


                        </tr>
                        <tr>
                            <td><label for="password">Password:</label></td>
                            <td><input type="password" id="password" name="password" minlength="8" required>
                             <span class="error" id="PasswordError"></span></td>
                        </tr>
                        <tr>
                            <td><label for="confirmPassword">Confirm Password:</label></td>
                            <td><input type="password" id="confirmPassword"name="confirmPassword" minlength="8"required>
                             <span class="error" id="ConfirmError"></span></td>
                        </tr>
                    </table>
                </fieldset>

                <p>
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the terms and conditions</label>
                     <span class="error" id="TermsError"></span>
                </p>

                <button type="submit" class="btn">Register</button>
                <button type="reset">Clear</button>
                <p> Already have an account? <a href="login.html">Login here</a></p>
                </form>
                

                <div class="footer">
                <h5>Created By Sumaita Tasnim</h5>
                </div>

                    <script src="../JS/customerScript.js"></script>


           


  
</body>
</html>
